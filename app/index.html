}

// Запись: что обещала программа (рыночные курсы с запасом) и что вышло на деле, плюс реальный курс каждого шага.
function tradeRecord() {
  const c = drawer.c, o = ovFor(drawer.id);
  const start = o.start > 0 ? o.start : c.inAmt;
  const act = drawerRun(start), pred = drawerRun(start, { start: null, rate: [], got: [] });
  const pct = r => r.out / (start * c.bench) - 1;
  return {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    ts: Math.floor(Date.now() / 1000), league: market.league, source: market.source,
    nodes: c.nodes, names: c.nodes.map(name), start, out: act.out, gain: act.gain, pct: pct(act),
    pred: { out: pred.out, gain: pred.gain, pct: pct(pred) },
    steps: c.edges.map((e, k) => ({ from: c.nodes[k], to: e.to, give: act.amounts[k], got: act.amounts[k + 1], market: e.rate, keep: e.keep })),
  };
}
// ---------- режим «у Альвы» ----------
// Один шаг на весь экран крупно — для телефона или второго монитора рядом с игрой.
// Правки («Получил») общие с панелью шагов: что вписано здесь, видно и там.
const alva = { open: false, k: 0 };
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && "wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
    else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) {}  // не поддерживается или не https — экран может гаснуть
}
function openAlva() {
  const c = drawer.c, o = ovFor(drawer.id);
  const k = c.edges.findIndex((e, j) => !(o.got[j] > 0));
  alva.k = k < 0 ? c.edges.length : k;  // с первого невыполненного шага
  alva.open = true;
  $("#alva").hidden = false;
  document.body.classList.add("alva-open");
  keepAwake(true);
  renderAlva();
}
function closeAlva() {
  alva.open = false;
  $("#alva").hidden = true;
  document.body.classList.remove("alva-open");
  keepAwake(false);
  if (drawer.id) buildDrawer();  // перенести вписанное в поля панели
}
document.addEventListener("visibilitychange", () => { if (alva.open && !document.hidden) keepAwake(true); });

function renderAlva() {
  const c = drawer.c, o = ovFor(drawer.id), n = c.edges.length;
  const start = o.start > 0 ? o.start : c.inAmt;
  const run = drawerRun(start);
  const target = c.nodes[n];
  const big = id => `<span class="abig">${chip(id)}</span>`;
  const dots = c.edges.map((e, j) => `<span class="${o.got[j] > 0 ? "done" : j === alva.k ? "now" : ""}"></span>`).join("");
  let html = `<div class="alva-in"><div class="ahead"><div class="adots">${dots}</div>
    <span class="muted">${alva.k < n ? t("alvaStep", { k: alva.k + 1, n }) : t("alvaDone")}</span>
    <button type="button" class="ax" title="${esc(t("alvaClose"))}">×</button></div>`;
  if (alva.k >= n) {
    const pct = run.out / (start * c.bench) - 1, done = c.edges.every((e, j) => o.got[j] > 0);
    html += `<div class="asum"><div class="ak">${t("thProfit")}</div>
      <div class="aprofit ${run.gain > 0 ? "good" : "bad"}">${run.gain > 0 ? "+" : ""}${amt(run.gain)} ${esc(name(target))}</div>
      <div class="${run.gain > 0 ? "good" : "bad"}" style="font-size:20px">${pct1(pct)}</div>
      <div class="muted">${amt(start)} ${esc(name(c.nodes[0]))} → ${amt(run.out)} ${esc(name(target))}</div></div>
      <div class="anav"><button type="button" class="aback ghost">← ${t("alvaBack")}</button>
        <button type="button" class="asave"${done ? "" : " disabled"}>${t("dSave")}</button></div>
      ${done ? "" : `<div class="muted">${t("dSaveNeed")}</div>`}
      <button type="button" class="ghost aclose">${t("alvaClose")}</button></div>`;
  } else {
    const k = alva.k, e = c.edges[k], from = c.nodes[k], fwd = rateFwd(e);
    const [a, b] = fwd ? [from, e.to] : [e.to, from];
    const mr = fwd ? e.rate : 1 / e.rate;
    // Курс, при котором весь путь выходит в ноль относительно прямого обмена (остальные шаги — как сейчас).
    // Доход пути пропорционален курсу шага, поэтому порог = текущий курс × (напрямую / на выходе).
    // Если в следующих шагах уже вписано «Получил», от этого шага итог не зависит — порог не показываем.
    const rEff = o.rate[k] > 0 ? (fwd ? o.rate[k] : 1 / o.rate[k]) : e.rate * e.keep;
    const laterFixed = c.edges.some((x, j) => j > k && o.got[j] > 0);
    const rBe = !laterFixed && run.out > 0 ? rEff * run.direct / run.out : null;
    const be = rBe ? (fwd ? rBe : 1 / rBe) : null;
    const calc = run.calc[k];
    html += `<div class="arow"><span class="ak">${t("give")}</span><span class="av">${amt(run.amounts[k])}</span>${big(from)}</div>
      <div class="arow"><span class="ak">${t("alvaGet")}</span><span class="av">${Number.isInteger(calc) ? "" : "≈"}${amt(calc)}</span>${big(e.to)}</div>
      <div class="arate"><div class="ak">${t("alvaRate")}</div>
        <div class="arv">1 ${esc(name(a))} = <b>${fmt(mr)}</b> ${esc(name(b))}</div>
        ${be ? `<div class="abe" title="${esc(t("alvaBeTip"))}">${t("alvaBe")}: 1 ${esc(name(a))} ${fwd ? "≥" : "≤"} <b>${fmt(be)}</b> ${esc(name(b))}</div>` : ""}
      </div>
      <div class="agot"><div class="ak">${t("dActual")}, ${esc(name(e.to))}</div>
        <span class="stepper"><button type="button" tabindex="-1" data-d="-1">−</button><input data-f="got" data-k="${k}" type="text" inputmode="decimal" autocomplete="off" min="0" step="any" value="${o.got[k] ?? ""}" placeholder="${$("#round").checked ? calc : +calc.toFixed(4)}"><button type="button" tabindex="-1" data-d="1">+</button></span>
        <div class="muted ahint">${t("alvaGotHint")}</div></div>
      <div class="anav">${k > 0 ? `<button type="button" class="aback ghost">← ${t("alvaBack")}</button>` : ""}
        <button type="button" class="anext">${t(k + 1 < n ? "alvaNext" : "alvaFinish")} →</button></div></div>`;
  }
  const box = $("#alva");
  box.innerHTML = html;
  box.querySelector(".ax").onclick = closeAlva;
  box.querySelector(".aclose")?.addEventListener("click", closeAlva);
  box.querySelector(".aback")?.addEventListener("click", () => { alva.k--; renderAlva(); });
  box.querySelector(".anext")?.addEventListener("click", alvaNext);
  box.querySelector(".asave")?.addEventListener("click", async () => {
    await saveTrade();
    if (!$("#dSave") || $("#dSaveHint").classList.contains("good") || !(journal || []).length) closeAlva(); else closeAlva();
  });
  const inp = box.querySelector("input");
  if (inp) {
    inp.addEventListener("input", () => {
      const v = +inp.value;
      o.got[alva.k] = inp.value !== "" && v > 0 ? v : null;
      calcDrawer();
    });
    inp.addEventListener("keydown", ev => {
      if (ev.key === "ArrowUp" || ev.key === "ArrowDown") { ev.preventDefault(); bump(inp, ev.key === "ArrowUp" ? 1 : -1); }
    });
    box.querySelectorAll(".stepper button").forEach(btn => holdRepeat(btn, () => bump(inp, +btn.dataset.d)));
  }
}
// «Готово»: если «Получил» пустое — считаем, что пришло расчётное количество.
function alvaNext() {
  const c = drawer.c, o = ovFor(drawer.id), k = alva.k;
  if (!(o.got[k] > 0)) {
    const run = drawerRun(o.start > 0 ? o.start : c.inAmt);
    o.got[k] = $("#round").checked ? run.calc[k] : +run.calc[k].toFixed(4);
  }
  calcDrawer();
  alva.k++;
  renderAlva();
}
document.addEventListener("keydown", e => {
  if (!alva.open) return;
  if (e.key === "Enter" && alva.k < drawer.c.edges.length) { e.preventDefault(); alvaNext(); }
  else if (e.key === "ArrowLeft" && alva.k > 0 && document.activeElement?.tagName !== "INPUT") { alva.k--; renderAlva(); }
});

async function saveTrade() {
  const hint = $("#dSaveHint");
  $("#dSave").disabled = true;
  try {
    await journalOp({ op: "add", trade: tradeRecord() });
    // Сделка записана — правки этого пути больше не нужны.
    overrides.delete(drawer.id);
    Object.assign(drawer, { savedId: drawer.id, savedAt: Date.now() });
    buildDrawer();
    const id = drawer.id;
    setTimeout(() => { if (drawer.id === id) calcDrawer(); }, 4100);
  } catch (e) {
    hint.className = "bad";
    hint.textContent = t("dSaveErr", { e: e.message });
    $("#dSave").disabled = false;
  }
}

const median = a => { const v = [...a].sort((x, y) => x - y); return v.length ? (v.length % 2 ? v[v.length >> 1] : (v[v.length / 2 - 1] + v[v.length / 2]) / 2) : NaN; };
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : NaN;
// Значок валюты из текущего рынка, если он есть; иначе — сохранённое название.
const jchip = (id, nm) => market?.items[id] ? chip(id) : `<span class="cur">${esc(nm || id)}</span>`;
const signCls = x => x > 0 ? "good" : x < 0 ? "bad" : "muted";

function renderJournal() {
  const box = $("#tab-journal");
  if (journal === null) { box.innerHTML = `<div class="empty">${t("jNoServer")}</div>`; return; }
  if (!journal.length) { box.innerHTML = `<div class="empty">${t("jEmpty")}</div>`; return; }
  const list = [...journal].sort((a, b) => b.ts - a.ts);
  const L = k => ` data-label="${esc(t(k))}"`;
  const mi = (k, v, cls = "") => `<div class="mi"><span class="mk">${k}</span><span class="mv ${cls}">${v}</span></div>`;

  // Сводка: прибыль по каждой конечной валюте отдельно.
  const byCur = {};
  for (const r of list) {
    const k = r.nodes[r.nodes.length - 1];
    byCur[k] = byCur[k] || { gain: 0, nm: r.names?.[r.names.length - 1] || k };
    byCur[k].gain += r.gain;
  }
  const total = Object.entries(byCur).map(([id, v]) => `<span class="${signCls(v.gain)}">${v.gain > 0 ? "+" : ""}${amt(+v.gain.toFixed(4))}</span> ${esc(market?.items[id] ? name(id) : v.nm)}`).join("<br>");
  const diff = mean(list.map(r => r.pct - r.pred.pct));
  let html = `<div class="jsum dmeta">
    ${mi(t("jTrades"), list.length)}
    ${mi(t("jTotal"), total)}
    ${mi(t("jAvg"), pct1(mean(list.map(r => r.pct))), signCls(mean(list.map(r => r.pct))))}
    ${mi(t("jVsPred"), `<span title="${esc(t("jVsPredTip"))}">${pct1(diff)}</span>`, signCls(diff))}
  </div>`;

  // Мои пары: насколько реальный курс шага отличался от среднего рыночного.
  const pairs = {};
  for (const r of list) for (const st of r.steps) {
    if (!(st.give > 0 && st.got > 0 && st.market > 0)) continue;
    const k = st.from + ">" + st.to;
    (pairs[k] = pairs[k] || { from: st.from, to: st.to, slip: [], margin: [], names: r.names, nodes: r.nodes }).slip.push(st.got / st.give / st.market - 1);
    pairs[k].margin.push(1 - (st.keep ?? 1));
  }
  const prow = Object.values(pairs).sort((a, b) => b.slip.length - a.slip.length || median(a.slip) - median(b.slip));
  const nm = (id, pr) => pr.names?.[pr.nodes.indexOf(id)];
  html += `<h3 class="jh">${t("jPairsTitle")}<span class="tip" data-tip="hJPairs"></span></h3>
  <table class="rt"><thead><tr><th>${t("jPair")}</th><th class="num">${t("jSteps")}</th><th class="num">${t("jSlip")}</th><th class="num">${t("jMargin")}</th></tr></thead><tbody>`;
  for (const pr of prow) {
    const sl = median(pr.slip), mg = median(pr.margin);
    // Реальный курс хуже среднего сильнее, чем закладывает запас, — программа здесь слишком оптимистична.
    const worse = -sl > mg + 0.002;
    html += `<tr class="cyc jrow"><td class="wide"><div class="path">${jchip(pr.from, nm(pr.from, pr))}<span class="arrow">→</span>${jchip(pr.to, nm(pr.to, pr))}</div></td>
      <td class="num"${L("jSteps")}>${pr.slip.length}</td>
      <td class="num ${signCls(sl)}"${L("jSlip")}>${pct1(sl)}</td>
      <td class="num${worse ? " warn" : ""}"${L("jMargin")} ${worse ? `title="${esc(t("jMarginLow"))}"` : ""}>${(mg * 100).toFixed(1)}%${worse ? " ⚠" : ""}</td></tr>`;
  }
  html += `</tbody></table>`;

  // Список сделок
  html += `<div class="jhead"><h3 class="jh">${t("jList")}</h3><button id="jExport" type="button" class="ghost">${t("jExport")}</button></div>
  <table class="rt"><thead><tr><th>${t("jWhen")}</th><th>${t("thPath")}</th><th class="num">${t("thAmt")}</th><th class="num">${t("thProfit")}</th>
    <th class="num">${t("jForecast")}</th><th class="num">${t("jDiff")}</th><th></th></tr></thead><tbody>`;
  for (const r of list) {
    const tn = esc(market?.items[r.nodes[r.nodes.length - 1]] ? name(r.nodes[r.nodes.length - 1]) : r.names?.[r.names.length - 1] || "");
    const when = new Date(r.ts * 1000).toLocaleString(locale(), { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    const d = r.pct - r.pred.pct;
    html += `<tr class="cyc jrow">
      <td${L("jWhen")}>${when}<div class="muted">${esc(r.league)}</div></td>
      <td class="wide"><div class="path">${r.nodes.map((id, i) => jchip(id, r.names?.[i])).join(`<span class="arrow">→</span>`)}</div></td>
      <td class="num"${L("thAmt")}>${amt(r.start)} → <b>${amt(r.out)}</b></td>
      <td class="num ${signCls(r.gain)}"${L("thProfit")}>${r.gain > 0 ? "+" : ""}${amt(+r.gain.toFixed(4))} ${tn}<div>${pct1(r.pct)}</div></td>
      <td class="num muted"${L("jForecast")}>${pct1(r.pred.pct)}</td>
      <td class="num ${signCls(d)}"${L("jDiff")}>${pct1(d)}</td>
      <td class="num"><button type="button" class="jdel" data-id="${esc(r.id)}" title="${esc(t("jDel"))}">×</button></td></tr>`;
  }
  html += `</tbody></table>`;
  box.innerHTML = html;
  prepTips(box);
  box.querySelectorAll(".jdel").forEach(b => b.onclick = async () => {
    if (!confirm(t("jDelConfirm"))) return;
    try { await journalOp({ op: "delete", id: b.dataset.id }); } catch (e) { alert(e.message); }
  });
  $("#jExport").onclick = exportJournal;
}

// CSV для Excel / Google Таблиц: точка с запятой и BOM, чтобы кириллица и дроби открывались правильно.
function exportJournal() {
  const q = v => `"${String(v).replace(/"/g, '""')}"`;
  const rows = [["date", "league", "path", "start", "out", "gain", "profit_%", "forecast_%", "steps"].join(";")];
  for (const r of [...journal].sort((a, b) => a.ts - b.ts)) {
    rows.push([new Date(r.ts * 1000).toISOString(), q(r.league), q((r.names || r.nodes).join(" > ")), r.start, r.out, +r.gain.toFixed(6),
      (r.pct * 100).toFixed(2), (r.pred.pct * 100).toFixed(2),
      q(r.steps.map(st => `${st.give} → ${st.got} @ ${(st.got / st.give / st.market * 100 - 100).toFixed(2)}%`).join(" | "))].join(";"));
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + rows.join("\r\n")], { type: "text/csv;charset=utf-8" }));
  a.download = `poe2flip-journal-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---------- вкладка «туда-обратно» ----------
// Простой флип A → B → A. В данных один средний курс на пару (без спреда), поэтому по рынку такой круг
// всегда в ноль минус запас — прибыль даёт только разница цен покупки и продажи в стакане.
// Здесь пары ранжируются по ликвидности, а реальные курсы вписываются в панели шагов.
function flipCandidates(cap = +$("#capital").value || 1) {
  if (!market) return [];
  const base = $("#base").value;
  const whole = $("#round").checked;
  const maxHours = +$("#maxHours").value || Infinity;
  const { adj, direct } = buildGraph(+$("#minVol").value || 0);
  const out = [];
  for (const e1 of adj.get(base) || []) {
    const e2 = direct.get(e1.to + "|" + base);
    if (!e2) continue;
    const c = { nodes: [base, e1.to, base], edges: [e1, e2], bench: 1, minVol: e1.vol, flip: true,
                volatile: e1.chg !== null && Math.abs(e1.chg) > VOLATILE };
    c.inAmt = whole ? Math.max(1, Math.floor(cap + 1e-9)) : cap;
    c.amounts = simulate(c, c.inAmt, whole);
    // Меньше одной штуки купить нельзя — на такой капитал флип невыполним (например, Mirror за 10 div).
    if (c.amounts.some(x => x < 1)) continue;
    const capDiv = c.inAmt * divValue(base);
    c.hours = stepHours(e1, capDiv) + stepHours(e2, capDiv);
    if (c.hours > maxHours) continue;
    const gs = goldSteps(c.nodes, c.amounts);
    c.gold = goldSum(gs);
    c.goldUnknown = gs.includes(null);
    out.push(c);
  }
  return out;
}

function renderFlips() {
  const box = $("#tab-flips");
  if (!market) { box.innerHTML = `<div class="empty">${t("noData")}</div>`; return; }
  const base = $("#base").value, bn = esc(name(base));
  const goldOn = Object.values(market.items).some(it => it.gold > 0);
  let list = flipCandidates();
  const cmp = {
    volume: (a, b) => b.minVol - a.minVol,
    time: (a, b) => a.hours - b.hours,
    chg: (a, b) => Math.abs(b.edges[0].chg ?? 0) - Math.abs(a.edges[0].chg ?? 0),
    gold: (a, b) => a.gold - b.gold,
  }[flipSort];
  list.sort(cmp);
  const nFav = list.filter(c => isFav(c.nodes.join(">"))).length;
  favCount.flips = nFav; updateFavBtn();
  if (ui.favOnly) list = list.filter(c => isFav(c.nodes.join(">")));
  const total = list.length;
  counts.flips = total; updateFilterUi(); scheduleCapPreview();
  list = list.slice(0, 300);
  const intro = `<div class="muted" style="margin-bottom:8px">${t("flipsIntro", { b: bn, n: total })}<span class="tip" data-tip="hFlips"></span></div>`;
  if (!total) { box.innerHTML = intro + `<div class="empty">${t(ui.favOnly ? "favNone" : "flipsNone")}</div>`; prepTips(box); wireFav(box); return; }
  const arrowTh = k => flipSort === k ? " ▾" : "";
  const L = k => ` data-label="${esc(t(k))}"`;
  const sorts = [["volume", "thVol"], ["chg", "thChg"], ["time", "thTime"], ...(goldOn ? [["gold", "thGold"]] : [])];
  let html = intro + sortSelect("flipSort", sorts, flipSort) + `<table class="rt"><thead><tr>
    <th>${t("thPair")}</th>
    <th class="num">${t("thRate")}</th>
    <th class="num" data-sort="volume" title="${t("flipVolTitle")}">${t("thVol")}${arrowTh("volume")}</th>
    ${market.source === "ggg" ? `<th class="num" title="${t("flipStockTitle")}">${t("thStock")}</th>` : ""}
    <th class="num" data-sort="chg" title="${t("flipChgTitle")}">${t("thChg")}${arrowTh("chg")}</th>
    <th class="num" data-sort="time" title="${t("thTimeTitle")}">${t("thTime")}${arrowTh("time")}</th>
    ${goldOn ? `<th class="num" data-sort="gold" title="${t("flipGoldTitle")}">${t("thGold")}${arrowTh("gold")}</th>` : ""}
  </tr></thead><tbody>`;
  for (const c of list) {
    const [e1, e2] = c.edges, other = e1.to, id = c.nodes.join(">");
    const ratio = e1.rate >= 1
      ? `1 ${bn} = ${fmt(e1.rate)} ${esc(name(other))}`
      : `1 ${esc(name(other))} = ${fmt(1 / e1.rate)} ${bn}`;
    // Процент и график — для того же числа, что в колонке «Курс» (1 дорогая = N дешёвых).
    const shownEdge = e1.rate >= 1 ? e1 : e2;
    const chgCls = shownEdge.chg !== null && Math.abs(shownEdge.chg) > VOLATILE ? "warn" : "muted";
    html += `<tr class="cyc${drawer.id === id ? " sel" : ""}" data-id="${esc(id)}">
      <td class="wide"><div class="path">${favBtn(id)}${chip(base)}<span class="arrow">⇄</span>${chip(other)}</div></td>
      <td class="num wide"${L("thRate")}>${ratio}</td>
      <td class="num"${L("thVol")}>${fmt(c.minVol)} div</td>
      ${market.source === "ggg" ? `<td class="num"${L("thStock")}>${e1.stock == null ? "—" : amt(e1.stock)} / ${e2.stock == null ? "—" : amt(e2.stock)}</td>` : ""}
      <td class="num"${L("thChg")}><span class="chg">${sparkline(shownEdge.hist && shownEdge.hist.slice(-12))}<span class="${chgCls}">${pctStr(shownEdge.chg)}</span></span></td>
      <td class="num"${L("thTime")}>${dur(c.hours)}</td>
      ${goldOn ? `<td class="num"${L("thGold")}>${fmtGold(c.gold)}${c.goldUnknown ? "?" : ""}</td>` : ""}
    </tr>`;
  }
  html += "</tbody></table>";
  box.innerHTML = html;
  prepTips(box);
  box.querySelectorAll("th[data-sort]").forEach(th => th.onclick = () => { flipSort = th.dataset.sort; renderFlips(); });
  $("#flipSort").onchange = e => { flipSort = e.target.value; renderFlips(); };
  wireFav(box);
  const byId = new Map(list.map(c => [c.nodes.join(">"), c]));
  box.querySelectorAll("tr.cyc").forEach(tr => tr.onclick = () => {
    if (drawer.id === tr.dataset.id) closeDrawer(); else openDrawer(byId.get(tr.dataset.id));
  });
}

// ---------- вкладка «курсы» ----------
function renderRates() {
  const box = $("#rates");
  if (!market) { box.innerHTML = ""; return; }
  const q = $("#search").value.trim().toLowerCase();
  if (q.length < 2) { box.innerHTML = `<div class="muted">${t("ratesMin")}</div>`; return; }
  const ids = Object.keys(market.items).filter(id => (market.items[id].name || id).toLowerCase().includes(q)).slice(0, 15);
  let html = "";
  for (const id of ids) {
    const rows = market.pairs.filter(p => p.from === id || p.to === id).map(p => {
      const other = p.from === id ? p.to : p.from;
      const rate = p.from === id ? p.rate : 1 / p.rate;
      return { other, rate, vol: p.volume };
    }).sort((a, b) => b.vol - a.vol);
    html += `<div class="steps" style="margin-bottom:10px"><div style="margin-bottom:6px">${chip(id)}
      <span class="muted">${esc(market.items[id].category || "")}</span></div>`;
    if (!rows.length) html += `<div class="muted">${t("ratesNoPairs")}</div>`;
    for (const r of rows) {
      const txt = r.rate >= 1 ? `1 ${esc(name(id))} = ${fmt(r.rate)} ${esc(name(r.other))}`
                              : `1 ${esc(name(r.other))} = ${fmt(1 / r.rate)} ${esc(name(id))}`;
      html += `<div>${chip(r.other)} ${txt} <span class="muted">· ${fmt(r.vol)} ${t("perDay")}</span></div>`;
    }
    html += "</div>";
  }
  box.innerHTML = html || `<div class="muted">${t("ratesNone")}</div>`;
}

// ---------- данные ----------
const isGGG = () => $("#source").value === "ggg";
const hhmm = ts => new Date(ts * 1000).toLocaleTimeString(locale(), { hour: "2-digit", minute: "2-digit" });

async function loadMarket() {
  const league = $("#league").value;
  const r = await fetch(`/api/market?source=${$("#source").value}&league=${encodeURIComponent(league)}&window=${$("#window").value}`);
  market = await r.json();
  divCache.clear();
  if (market && market.error) { const err = market.error; setStatus(() => t("error", { e: err }), true); market = null; }
  if (market) {
    if (market.source !== "ggg") {
      // poe.ninja отдаёт объём за последний час (сверено с почасовыми сводками GGG) — приводим к суткам.
      for (const p of market.pairs) { p.volume *= 24; if (p.vol7) p.vol7 *= 24; }
    }
    const cur = $("#base").value || saved.base || "divine";
    const curT = $("#target").options.length ? $("#target").value : (saved.target || "");
    const opts = market.core.map(id => `<option value="${esc(id)}">${esc(name(id))}</option>`).join("");
    $("#base").innerHTML = opts;
    $("#base").value = market.core.includes(cur) ? cur : market.core[0];
    $("#target").innerHTML = `<option value="">${esc(t("sameAsStart"))}</option>` + opts;
    $("#target").value = market.core.includes(curT) && curT !== $("#base").value ? curT : "";
    renderCurSeg();
    const m = market;
    setStatus(() => t("statusLine", {
      league: m.league, n: Object.keys(m.items).length, p: m.pairs.length,
      period: m.source === "ggg" ? t("periodGgg", { a: hhmm(m.periodStart), b: hhmm(m.periodEnd) }) : t("periodNinja", { ago: ago(m.fetchedAt) }),
    }));
  } else if (!statusErr) {
    setStatus(() => t("noLeagueData"));
  }
  $("#window").disabled = !isGGG();
  renderExclude();
  renderCycles(); renderFlips(); renderRates(); renderJournal();
  checkNotify();
  return market;
}

async function refresh() {
  if ($("#refresh").disabled) return;
  const league = $("#league").value;
  $("#refresh").disabled = true;
  $("#bar").style.display = "block";
  await fetch(`/api/refresh?source=${$("#source").value}&league=${encodeURIComponent(league)}&minVolume=1`);
  while (true) {
    await new Promise(r => setTimeout(r, 700));
    const s = await (await fetch("/api/status")).json();
    $("#bar > div").style.width = s.total ? (100 * s.progress / s.total) + "%" : "5%";
    setStatus(() => srvMsg(s.message) + (s.total ? ` ${s.progress}/${s.total}` : ""));
    if (!s.running) {
      if (s.error) setStatus(() => t("error", { e: s.error }), true);
      break;
    }
  }
  $("#bar").style.display = "none";
  $("#refresh").disabled = false;
  await loadMarket();
}

function setAuto() {
  clearInterval(autoTimer);
  // GGG: новый час появляется в ~:05, проверка дешёвая (качается только недостающий час).
  if ($("#auto").checked) autoTimer = setInterval(refresh, (isGGG() ? 5 : 30) * 60 * 1000);
}

async function init() {
  applyStatic();
  for (const k of SETTINGS) {
    if (saved[k] === undefined || k === "league" || k === "base" || k === "target") continue;
    const el = $("#" + k);
    if (el.type === "checkbox") el.checked = saved[k]; else el.value = saved[k];
  }
  renderSegs();
  notifyUi();
  applyView();
  try {
    const leagues = await (await fetch("/api/leagues")).json();
    $("#league").innerHTML = leagues.map(l => `<option>${esc(l)}</option>`).join("");
    $("#league").value = leagues.includes(saved.league) ? saved.league : leagues[0];
  } catch (e) {
    $("#league").innerHTML = "<option>Standard</option>";
  }
  loadJournal();
  loadUpdate();
  loadLan();
  loadTg();
  const m = await loadMarket();
  if (isGGG() || !m || Date.now() / 1000 - m.fetchedAt > 30 * 60) refresh();
  setAuto();
}

$("#refresh").onclick = refresh;
$("#league").onchange = async () => { save(); const m = await loadMarket(); if (!m || isGGG()) refresh(); };
$("#source").onchange = async () => { save(); setAuto(); const m = await loadMarket(); if (!m || isGGG()) refresh(); };
$("#window").onchange = () => { save(); loadMarket(); };
$("#auto").onchange = () => { save(); setAuto(); notifyUi(); };
$("#notifyOn").onchange = () => { save(); notifyEnable(); if (tg?.linked) tgOp({ op: "settings", settings: notifySnapshot(), enabled: tgWanted() }); };
for (const k of ["notifyPct", "notifyStreak", "notifySound"]) $("#" + k).addEventListener("input", () => { save(); scheduleNotifyBaseline(); });
for (const k of ["base", "target", "round", "capital", "goldBudget", "goldEff", "maxLen", "fee", "minVol", "minProfit", "maxProfit", "share", "overhead", "maxHours", "minStreak", "noise"])
  $("#" + k).addEventListener("input", e => {
    save();
    // Набор с клавиатуры — пересчёт через паузу (на телефоне перерисовка на каждую цифру тормозит ввод);
    // кнопки −/+ и переключатели шлют синтетические события — пересчёт сразу.
    clearTimeout(typingTimer);
    const run = () => { renderCycles(); renderFlips(); scheduleNotifyBaseline(); };
    if (e.isTrusted && e.target.tagName === "INPUT" && e.target.type === "text") typingTimer = setTimeout(run, 250); else run();
  });
$("#search").addEventListener("input", renderRates);
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  for (const n of ["cycles", "flips", "rates", "journal"]) $("#tab-" + n).hidden = b.dataset.tab !== n;
  updateFilterUi(); scheduleCapPreview(); updateFavBtn();
});
init();
</script>
