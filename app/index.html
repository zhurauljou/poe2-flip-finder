    const e = { to: b, rate, vol, chg, vol7, stock, hist, keep, flow: vol7 ? Math.min(vol, vol7) : vol };
    if (!adj.has(a)) adj.set(a, []);
    adj.get(a).push(e);
    direct.set(a + "|" + b, e);
  };
  for (const p of market.pairs) {
    if (p.volume < minVol) continue;
    if (ex(p.from) || ex(p.to)) continue;
    const prev = p.prev > 0 ? p.prev : null;
    // stock — сколько валюты, которую получаешь на этом шаге, выставлено в заявках (только у GGG).
    // hist — почасовой курс за последние 12 ч (только у GGG).
    const keep = pairKeep(p.hist);  // шум в обе стороны одинаковый
    add(p.from, p.to, p.rate, p.volume, prev ? p.rate / prev - 1 : null, p.vol7, p.stockTo, p.hist, keep);
    add(p.to, p.from, 1 / p.rate, p.volume, prev ? prev / p.rate - 1 : null, p.vol7, p.stockFrom,
        p.hist && p.hist.map(x => x > 0 ? 1 / x : null), keep);
  }
  return { adj, direct };
}

// Путь лишний, если выкинуть какой-то промежуточный шаг (A→X→B заменить на A→B)
// и результат не станет хуже — тогда достаточно короткого варианта.
// Укороченный цикл должен остаться хотя бы из 3 обменов, путь — из 2 (иначе это просто прямой обмен).
function redundant(c, direct, isCycle) {
  const n = c.edges.length;
  if (n < (isCycle ? 4 : 3)) return false;
  for (let i = 1; i < n; i++) {
    const a = c.nodes[i - 1], b = c.nodes[i + 1];
    if (a === b) continue;
    const e = direct.get(a + "|" + b);
    if (!e) continue;
    const viaX = c.edges[i - 1].rate * c.edges[i - 1].keep * c.edges[i].rate * c.edges[i].keep;
    if (e.rate * e.keep >= viaX) return true;
  }
  return false;
}

// Сколько конечной валюты дал бы прямой обмен 1 стартовой — с этим сравниваем выгоду пути.
// Для цикла (конечная = стартовая) это просто 1.
function benchmark(base, target) {
  if (base === target) return 1;
  for (const p of market.pairs) {
    if (p.from === base && p.to === target) return p.rate * pairKeep(p.hist);
    if (p.to === base && p.from === target) return pairKeep(p.hist) / p.rate;
  }
  return divValue(base) / divValue(target) * pairKeep(null);
}

function findPaths() {
  const base = $("#base").value;
  const target = $("#target").value || base;
  const isCycle = base === target;
  const maxLen = +$("#maxLen").value;
  const minVol = +$("#minVol").value || 0;
  const bench = benchmark(base, target);
  const lo = bench * (1 + (+$("#minProfit").value || 0) / 100);
  const hi = bench * (1 + (+$("#maxProfit").value || 1e9) / 100);
  const { adj, direct } = buildGraph(minVol);
  const out = [];
  const path = [base], edges = [], used = new Set([base]);
  let steps = 0;

  // depth — номер обмена, который делаем следующим ребром (1 = первый обмен).
  // Граф звездообразный (почти всё торгуется только к Divine/Exalted/Chaos),
  // поэтому полный перебор до 5 шагов занимает доли секунды.
  function dfs(node, amt, depth) {
    if (++steps > 5e6) return;
    for (const e of adj.get(node) || []) {
      const next = amt * e.rate * e.keep;
      if (e.to === target) {
        // Один обмен — это и есть прямой обмен, с ним и сравниваем; интересны пути от 2 шагов.
        if (depth >= 2 && next >= lo && next <= hi) {
          const all = [...edges, e];
          const c = { nodes: [...path, target], edges: all, mult: next, bench,
                      minVol: Math.min(...all.map(x => x.vol)),
                      volatile: all.some(x => x.chg !== null && Math.abs(x.chg) > VOLATILE) };
          if (!redundant(c, direct, isCycle)) out.push(c);
        }
        continue;
      }
      if (depth >= maxLen || used.has(e.to)) continue;
      used.add(e.to); path.push(e.to); edges.push(e);
      dfs(e.to, next, depth + 1);
      used.delete(e.to); path.pop(); edges.pop();
    }
  }
  dfs(base, 1, 1);
  return out;
}

// Прогон суммы по шагам. В целом режиме на бирже отдаёшь и получаешь только целые штуки,
// поэтому после каждого обмена дробная часть отбрасывается.
function simulate(c, start, whole) {
  const amounts = [start];
  let amt = start;
  for (const e of c.edges) {
    amt = amt * e.rate * e.keep;
    if (whole) amt = Math.floor(amt + 1e-9);
    amounts.push(amt);
  }
  return amounts;
}

// Сколько штук дал бы прямой обмен n единиц (для цикла — сами n).
function directWhole(n, bench) {
  return bench === 1 ? n : Math.floor(n * bench + 1e-9);
}

// Подбирает целую стартовую сумму не больше капитала:
//  best  — максимум прибыли в штуках (при равенстве — меньшая сумма);
//  batch — лучший процент, т.е. «порция», которую выгодно повторять (4 div → 5 div).
function wholePlan(c, cap, g) {
  const nMax = Math.floor(cap + 1e-9);
  if (nMax < 1) return null;
  let best = null, batch = null;
  for (let n = nMax; n >= Math.max(1, nMax - 3000); n--) {
    const a = simulate(c, n, true);
    if (goldSum(goldSteps(c.nodes, a)) > g.budget) continue;  // не влезает в бюджет золота
    const outAmt = a[a.length - 1], gain = outAmt - directWhole(n, c.bench);
    if (gain <= 1e-9) continue;
    if (!best || gain >= best.gain - 1e-9) best = { amounts: a, gain };
    const pct = outAmt / (n * c.bench);
    if (!batch || pct >= batch.pct - 1e-12) batch = { amounts: a, pct };
  }
  return best ? { ...best, batch } : null;
}

// Пути с суммами, прибылью, золотом и временем для заданного капитала; отсеивает по фильтрам.
// Пути копируются, чтобы предпросмотр капитала не портил объекты, показанные в таблице.
// «Держится N ч»: сколько последних часов подряд курсы реальных сделок (по часу, без усреднения) давали
// прибыль не меньше «Прибыль от». По истории за 2 суток это лучший признак, что путь сохранится в следующем
// часу: 0 ч — 49%, 1–2 ч — ~67%, 3–5 ч — 76%, 6–11 ч — 83%, 12+ ч — 92%.
// Час без сделок по одной из пар прерывает серию. null — истории нет (poe.ninja).
function pathStreak(c, minPct, isCycle, dh, dk) {
  const hist = pathProfitHist(c, isCycle, dh, dk);
  if (!hist) return null;
  let n = 0;
  for (let h = hist.length - 1; h >= 0 && hist[h] != null && hist[h] >= minPct; h--) n++;
  return n;
}
// Прибыль пути в каждом из последних часов по курсам сделок того часа, с запасом (старые первыми).
// Для пути с другой конечной — относительно прямого обмена в том же часу. null — в этот час по одной из пар не было сделок.
function pathProfitHist(c, isCycle, dh, dk) {
  const H = c.edges[0].hist?.length;
  if (!H || (!isCycle && !dh)) return null;
  return Array.from({ length: H }, (_, h) => {
    let x = 1;
    for (const e of c.edges) {
      const r = e.hist?.[h];
      if (!(r > 0)) return null;
      x *= r * e.keep;
    }
    const bench = isCycle ? 1 : dh[h] > 0 ? dh[h] * dk : null;
    return bench ? x / bench - 1 : null;
  });
}
// Почасовая история пары стартовая–конечная как есть (для запаса — он от направления не зависит).
function directPairHist(base, target) {
  return market.pairs.find(p => p.from === base && p.to === target || p.to === base && p.from === target)?.hist || null;
}
// Почасовой курс прямого обмена стартовой на конечную.
function directHist(base, target) {
  for (const p of market.pairs) {
    if (p.from === base && p.to === target) return p.hist || null;
    if (p.to === base && p.from === target) return p.hist ? p.hist.map(x => x > 0 ? 1 / x : null) : null;
  }
  return null;
}
function streakText(c) {
  if (c.streak == null) return "—";
  const H = c.edges[0].hist.length;
  return t("streakVal", { n: c.streak >= H ? H + "+" : c.streak });
}

// Шанс, что путь продержится ещё час (прибыль ≥1% в следующем часу), по «держится» — измерено на истории
// (2 суток, ~3900 путей): 0 ч — 43%, 1–2 ч — 63%, 3–5 ч — 73%, 6–11 ч — 80%, 12+ ч — 91%; без истории — 66%.
function holdChance(streak) {
  if (streak == null) return 0.66;
  return streak === 0 ? 0.43 : streak <= 2 ? 0.63 : streak <= 5 ? 0.73 : streak <= 11 ? 0.80 : 0.91;
}
// Рейтинг = прибыль × шанс продержаться × log(ликвидность). На истории (вторая половина, вероятности — по первой)
// в топ-10 прибыль ≥1% в следующем часу сохраняли 89% путей против 82% у прежнего «прибыль × log(ликвидность)».
const rating = c => c.pct * holdChance(c.streak) * Math.log1p(c.minVol);

function evalCycles(paths, cap) {
  const base = $("#base").value;
  const target = $("#target").value || base;
  const whole = $("#round").checked;
  const maxHours = +$("#maxHours").value || Infinity;
  const minPct = (+$("#minProfit").value || 0) / 100;
  const minStreak = +$("#minStreak").value || 0;
  const dh = base === target ? null : directHist(base, target);
  const dhRaw = base === target ? null : directPairHist(base, target);
  const g = goldCfg();
  const cyc = [];
  for (const p of paths) {
    const c = { ...p };
    if (whole) {
      const plan = wholePlan(c, cap, g);
      if (!plan) continue;  // после округлений (или в пределах бюджета золота) прибыли не остаётся
      c.amounts = plan.amounts;
      c.batch = plan.batch;
      c.capped = c.amounts[0] < Math.floor(cap + 1e-9) && goldSum(goldSteps(c.nodes, simulate(c, Math.floor(cap + 1e-9), true))) > g.budget;
    } else {
      c.amounts = simulate(c, cap, false);
      // Золото растёт пропорционально сумме — если не влезает в бюджет, уменьшаем сумму.
      const need = goldSum(goldSteps(c.nodes, c.amounts));
      if (need > g.budget) {
        c.amounts = simulate(c, cap * g.budget / need, false);
        c.capped = true;
      }
      // Меньше одной штуки купить нельзя — с таким капиталом путь невыполним.
      if (c.amounts.some(x => x < 1)) continue;
    }
    c.inAmt = c.amounts[0];
    c.outAmt = c.amounts[c.amounts.length - 1];
    c.direct = whole ? directWhole(c.inAmt, c.bench) : c.inAmt * c.bench;
    c.gain = c.outAmt - c.direct;
    c.pct = c.outAmt / (c.inAmt * c.bench) - 1;
    c.goldSteps = goldSteps(c.nodes, c.amounts);
    c.gold = goldSum(c.goldSteps);
    c.goldUnknown = c.goldSteps.includes(null);
    c.eff = goldEff(c.gain * divValue(target), c.gold);
    c.hours = c.edges.reduce((s, e) => s + stepHours(e, c.inAmt * divValue(base)), 0);
    c.perHour = c.gain / c.hours;
    if (c.hours > maxHours) continue;
    if (g.on && c.eff < g.minEff) continue;
    c.streak = pathStreak(c, minPct, base === target, dh, dh && pairKeep(dhRaw));
    if (minStreak && !(c.streak >= minStreak)) continue;
    cyc.push(c);
  }
  return cyc;
}

function renderCycles() {
  const box = $("#tab-cycles");
  if (!market) { box.innerHTML = `<div class="empty">${t("noData")}</div>`; closeDrawer(); counts.cycles = 0; updateFilterUi(); return; }
  const t0 = performance.now();
  const base = $("#base").value;
  const target = $("#target").value || base;
  const isCycle = base === target;
  const whole = $("#round").checked;
  const g = goldCfg();
  let cyc = evalCycles(findPaths(), +$("#capital").value || 1);
  scheduleCapPreview();
  const ms = Math.round(performance.now() - t0);
  const score = rating;
  markSeen(cyc);
  const cmp = {
    seen: (a, b) => b.seen - a.seen || score(b) - score(a),
    streak: (a, b) => (b.streak ?? -1) - (a.streak ?? -1) || score(b) - score(a),
    profit: (a, b) => b.pct - a.pct,
    volume: (a, b) => b.minVol - a.minVol,
    score: (a, b) => score(b) - score(a),
    len: (a, b) => a.edges.length - b.edges.length || b.pct - a.pct,
    time: (a, b) => a.hours - b.hours,
    perHour: (a, b) => b.perHour - a.perHour,
    gold: (a, b) => b.eff - a.eff,
  }[sortKey] || ((a, b) => score(b) - score(a));
  cyc.sort(cmp);
  const byId = new Map([...cyc, ...flipCandidates()].map(c => [c.nodes.join(">"), c]));
  if (pendingOpen) {
    const c = byId.get(pendingOpen);
    pendingOpen = null;
    if (c) openDrawer(c);
  }
  syncDrawer(byId);
  const nFav = cyc.filter(c => isFav(c.nodes.join(">"))).length;
  favCount.cycles = nFav; updateFavBtn();
  if (ui.favOnly) cyc = cyc.filter(c => isFav(c.nodes.join(">")));
  const total = cyc.length;
  counts.cycles = total; updateFilterUi();
  cyc = cyc.slice(0, 300);
  const what = t(isCycle ? "whatCycles" : "whatPaths");
  if (!total) {
    const extra = (g.minEff ? t("emptyEff") : "") + (isFinite(g.budget) ? t("emptyBudget") : "") + (whole ? t("emptyWhole") : "");
    box.innerHTML = `<div class="empty">${ui.favOnly ? t("favNone") : t("empty", { what, extra })}</div>`;
    wireFav(box);
    return;
  }
  const tn = esc(name(target)), bn = esc(name(base));
  const vs = isCycle ? "" : t("vs", { b: bn, t: tn, r: fmt(cyc[0].bench) });
  const arrowTh = k => sortKey === k ? " ▾" : "";
  const L = k => ` data-label="${esc(t(k))}"`;
  const sorts = [["score", "thScore"], ["profit", "thProfit"], ["perHour", "thPerHour"], ["time", "thTime"],
                 ["volume", "thVol"], ...(g.on ? [["gold", "thGold"]] : []), ["streak", "thStreak"], ["seen", "thSeen"], ["len", "thPath"]];
  let html = `<div class="muted" style="margin-bottom:8px">${t("found", { what, n: total, more: total > 300 ? t("foundMore") : "", ms })}${vs}</div>
  ${sortSelect("cycSort", sorts, sortKey)}
  <table class="rt"><thead><tr>
    <th data-sort="len">${t("thPath")}${arrowTh("len")}</th>
    <th class="num" data-sort="profit">${t("thProfit")}${arrowTh("profit")}</th>
    <th class="num" title="${whole ? t("thAmtTitle") : ""}">${bn} → ${tn}</th>
    <th class="num" data-sort="time" title="${t("thTimeTitle")}">${t("thTime")}${arrowTh("time")}</th>
    ${g.on ? `<th class="num" data-sort="gold" title="${t("thGoldTitle")}">${t("thGold")}${arrowTh("gold")}</th>` : ""}
    <th class="num" data-sort="perHour" title="${t("thPerHourTitle", { t: tn })}">${t("thPerHour")}${arrowTh("perHour")}</th>
    <th class="num" data-sort="volume" title="${t("thVolTitle")}">${t("thVol")}${arrowTh("volume")}</th>
    <th class="num" data-sort="score" title="${t("thScoreTitle")}">${t("thScore")}${arrowTh("score")}</th>
    <th class="num" data-sort="streak" title="${t("thStreakTitle")}">${t("thStreak")}${arrowTh("streak")}</th>
    <th class="num" data-sort="seen" title="${t("thSeenTitle")}">${t("thSeen")}${arrowTh("seen")}</th>
  </tr></thead><tbody>`;
  cyc.forEach((c, i) => {
    const pathHtml = c.nodes.map(chip).join(`<span class="arrow">→</span>`);
    const id = c.nodes.join(">");
    html += `<tr class="cyc${drawer.id === id ? " sel" : ""}" data-id="${esc(id)}" data-i="${i}">
      <td class="wide"><div class="path">${favBtn(id)}${pathHtml}</div></td>
      <td class="num good big"${L("thProfit")}>+${(c.pct * 100).toFixed(2)}%${c.volatile
        ? `<div class="warn" title="${t("volatileTitle")}">${t("volatile")}</div>` : ""}</td>
      <td class="num"${L("thAmt")}>${amt(c.inAmt)} → <b>${amt(c.outAmt)}</b><div class="muted">+${amt(c.gain)} ${tn}${
        isCycle ? "" : ` · ${t("direct")} ${amt(c.direct)}`}</div>${c.capped
        ? `<div class="warn" title="${t("cappedTitle")}">${t("capped")}</div>` : ""}</td>
      <td class="num"${L("thTime")}>${dur(c.hours)}</td>
      ${g.on ? `<td class="num"${L("thGold")}>${fmtGold(c.gold)}${c.goldUnknown ? "?" : ""}<div class="muted"
        title="${t("perGoldTitle")}">${isFinite(c.eff) ? fmt(c.eff) : "∞"} ${t("perGold")}</div></td>` : ""}
      <td class="num"${L("thPerHour")}>${c.perHour > 0 ? "+" : ""}${fmt(c.perHour)}</td>
      <td class="num"${L("thVol")}>${fmt(c.minVol)} div</td>
      <td class="num c-score"${L("thScore")}>${(score(c) * 100).toFixed(1)}</td>
      <td class="num${c.streak ? "" : " muted"}"${L("thStreak")}>${streakText(c)}</td>
      <td class="num"${L("thSeen")}>${seenBadge(c.seen)}</td></tr>`;
  });
  html += "</tbody></table>";
  box.innerHTML = html;
  box.querySelectorAll("th[data-sort]").forEach(th => th.onclick = () => { sortKey = th.dataset.sort; renderCycles(); });
  $("#cycSort").onchange = e => { sortKey = e.target.value; renderCycles(); };
  wireFav(box);
  const shown = new Map(cyc.map(c => [c.nodes.join(">"), c]));
  box.querySelectorAll("tr.cyc").forEach(tr => tr.onclick = () => {
    if (drawer.id === tr.dataset.id) closeDrawer(); else openDrawer(shown.get(tr.dataset.id));
  });
}

// Целые суммы печатаем без копеек.
function amt(x) {
  return Number.isInteger(x) ? x.toLocaleString(locale()) : fmt(x);
}

// ---------- панель шагов ----------
// Справа открывается выбранный путь. Курс каждого шага и фактически полученное количество можно
// переписать — всё дальше пересчитывается локально. Правки живут до перезагрузки страницы.
const drawer = { id: null, c: null, gone: false };
const overrides = new Map();  // id пути -> { start, rate: [], got: [] }
// Правки и открытая панель переживают перезагрузку страницы. Правки, которые не трогали больше суток,
// забываются — курсы к тому времени всё равно устарели.
const OV_KEY = "poe2flip_ov", OV_TTL = 86400;
let pendingOpen = null, ovSaveTimer = null;
(() => {
  try {
    const d = JSON.parse(localStorage.getItem(OV_KEY)) || {}, now = Date.now() / 1000;
    for (const [id, o] of Object.entries(d.ovs || {})) {
      if (now - (o.ts || 0) <= OV_TTL) overrides.set(id, { start: o.start ?? null, rate: o.rate || [], got: o.got || [] });
    }
    pendingOpen = d.open || null;
    const h = location.hash.match(/^#open=(.+)$/);
    if (h) { pendingOpen = decodeURIComponent(h[1]); history.replaceState(null, "", location.pathname); }
  } catch (e) {}
})();
const ovEmpty = o => !(o.start > 0) && !o.rate.some(x => x > 0) && !o.got.some(x => x > 0);
function saveOverrides() {
  clearTimeout(ovSaveTimer);
  ovSaveTimer = setTimeout(() => {
    let prev = {};
    try { prev = JSON.parse(localStorage.getItem(OV_KEY))?.ovs || {}; } catch (e) {}
    const now = Math.floor(Date.now() / 1000), ovs = {};
    for (const [id, o] of overrides) {
      if (ovEmpty(o)) continue;
      // Время обновляем только если правки изменились — иначе просто открытая панель продлевала бы их бесконечно.
      const same = prev[id] && JSON.stringify([prev[id].start, prev[id].rate, prev[id].got]) === JSON.stringify([o.start, o.rate, o.got]);
      ovs[id] = { start: o.start, rate: o.rate, got: o.got, ts: same ? prev[id].ts : now };
    }
    try { localStorage.setItem(OV_KEY, JSON.stringify({ ovs, open: drawer.id })); } catch (e) {}
  }, 300);
}
function ovFor(id) {
  if (!overrides.has(id)) overrides.set(id, { start: null, rate: [], got: [] });
  return overrides.get(id);
}
function markSel() {
  document.querySelectorAll("tr.cyc").forEach(tr => tr.classList.toggle("sel", tr.dataset.id === drawer.id));
}
function openDrawer(c) {
  Object.assign(drawer, { id: c.nodes.join(">"), c, gone: false });
  $("#drawer").hidden = false;
  document.body.classList.add("drawer-open");
  buildDrawer(); markSel(); saveOverrides();
}
function closeDrawer() {
  if (!drawer.id) return;
  Object.assign(drawer, { id: null, c: null, gone: false });
  $("#drawer").hidden = true;
  document.body.classList.remove("drawer-open");
  markSel(); saveOverrides();
}
// После пересчёта таблицы подменяем путь свежим; если он выпал из фильтров — оставляем старый с пометкой.
function syncDrawer(byId) {
  if (!drawer.id) return;
  const c = byId.get(drawer.id);
  if (c) drawer.c = c;
  drawer.gone = !c;
  buildDrawer();
}
$("#dClose").onclick = closeDrawer;

// Прибыль всего пути по часам — видно, растёт она или тает.
function pathTrend(c) {
  const base = c.nodes[0], target = c.nodes[c.nodes.length - 1], isCycle = base === target;
  const hist = pathProfitHist(c, isCycle, isCycle ? null : directHist(base, target), isCycle ? 1 : pairKeep(directPairHist(base, target)));
  const fl = firstLast(hist);
  if (!fl) return "";
  const v = hist.filter(x => x != null);
  const cls = Math.abs(fl[1] - fl[0]) < 0.005 ? "flat" : fl[1] > fl[0] ? "up" : "down";
  const title = t("pathTrendTip", { n: hist.length, a: pct1(fl[0]), b: pct1(fl[1]), lo: pct1(Math.min(...v)), hi: pct1(Math.max(...v)) });
  return `<div class="dtrend" title="${esc(title)}">${trendSvg(hist, { w: 120, h: 30, cls, zero: true })}` +
    `<span class="${cls}">${t("trendH", { n: hist.length })}: ${pct1(fl[0])} → ${pct1(fl[1])}</span></div>`;
}

// Курс в поле показываем так же, как в игре: «1 дорогая = N дешёвых».
const rateFwd = e => e.rate >= 1;

function buildDrawer() {
  const c = drawer.c, o = ovFor(drawer.id), ggg = market.source === "ggg";
  // Перестройка не должна сбивать ввод, если данные обновились, пока поле в фокусе.
  const fa = document.activeElement;
  const focus = $("#dBody").contains(fa) && fa.dataset.f ? fa.dataset.f + "|" + (fa.dataset.k ?? "") : null;
  const base = c.nodes[0], target = c.nodes[c.nodes.length - 1];
  $("#dPath").innerHTML = c.nodes.map(chip).join(`<span class="arrow">→</span>`);
  $("#dClose").title = t("dClose");
  $("#dFav").textContent = isFav(drawer.id) ? "★" : "☆";
  $("#dFav").classList.toggle("on", isFav(drawer.id));
  $("#dFav").title = t(isFav(drawer.id) ? "favOff" : "favOn");
  $("#dFav").onclick = () => toggleFav(drawer.id);
  const num = (f, k, v, ph) => `<span class="stepper"><button type="button" tabindex="-1" data-d="-1">−</button><input data-f="${f}"${
    k == null ? "" : ` data-k="${k}"`} type="text" inputmode="decimal" autocomplete="off" min="0" step="any" value="${v ?? ""}" placeholder="${ph}"><button type="button" tabindex="-1" data-d="1">+</button></span>`;
  // Строка поля: слева подпись и пояснение, справа −/+ фиксированной ширины — поля стоят ровно в каждой карточке.
  const frow = (label, tip, caption, input, cls = "") => `<div class="frow ${cls}"><div class="fl"><span class="fk">${label}</span>${
    tip ? `<span class="tip" data-tip="${tip}"></span>` : ""}<div class="fc">${caption}</div></div>${input}</div>`;
  const mi = (k, v, cls = "") => `<div class="mi ${cls}"><span class="mk">${k}</span><span class="mv">${v}</span></div>`;
  let html = drawer.gone ? `<div class="dnote warn">${t("dGone")}</div>` : "";
  html += `<button id="dAlva" type="button" class="alva-btn" title="${esc(t("alvaBtnTip"))}">▶ ${t("alvaBtn")}</button>`;
  // Промежуточные валюты пути, которые можно скрыть одним кликом.
  const hideable = [...new Set(c.nodes.slice(1, -1))].filter(id => !market.core.includes(id));
  if (hideable.length) html += `<div class="dhide"><span class="muted">${t("hideCur")}</span>${hideable.map(id =>
    `<button type="button" class="xchip" data-hide="${esc(id)}" title="${esc(t("hideCurTip"))}">${esc(name(id))} ×</button>`).join("")}</div>`;
  html += `<div class="dsum">
    ${frow(t("dStart"), "hStart", esc(name(base)), num("start", null, o.start, c.inAmt), "first")}
    <div class="dprofit"><span class="mk">${t("thProfit")}</span><span id="dGain"></span><span id="dPct"></span>${pathTrend(c)}</div>
    <div class="dmeta" id="dMeta"></div>
  </div><ol class="dsteps">`;
  c.edges.forEach((e, k) => {
    const from = c.nodes[k], to = e.to, fwd = rateFwd(e);
    const [a, b] = fwd ? [from, to] : [to, from];
    const mr = fwd ? e.rate : 1 / e.rate;
    const chgCls = e.chg !== null && Math.abs(e.chg) > VOLATILE ? "warn" : "";
    html += `<li class="dstep" data-k="${k}">
      <div class="dhd"><span class="dnum">${k + 1}</span><div class="dflow">
        <span class="k">${t("give")}</span><b data-give></b><span class="ch">${chip(from)}</span>
        <span class="k">${t("get")}</span><b data-got></b><span class="ch">${chip(to)}</span>
      </div>${stepTrend(e, fwd, t("ratePer", { a: esc(name(a)), b: esc(name(b)) }))}</div>
      ${frow(t("dRate"), "hRateOv", `${t("ratePer", { a: esc(name(a)), b: esc(name(b)) })}<span class="fm">${t("dMarket", { r: fmt(mr) })}</span>`,
             num("rate", k, o.rate[k], +mr.toPrecision(6)))}
      ${frow(t("dActual"), "hActual", esc(name(to)), num("got", k, o.got[k], ""))}
      <div class="dmeta">
        ${mi(t("vol"), `${fmt(e.vol)} ${t("perDay")}${e.vol7 ? `<small>${t(ggg ? "vol7Day" : "vol7Week")} ${fmt(e.vol7)}</small>` : ""}`)}
        ${e.stock == null ? "" : mi(t("stock"), amt(e.stock))}
        ${e.chg === null ? "" : mi(t(ggg ? "chgAvg" : "chgDay"), pctStr(e.chg), chgCls)}
        ${mi(t("dMargin"), `${((1 - e.keep) * 100).toFixed(1)}%`)}
        ${mi(t("thTime"), "", "dyn-time")}${mi(t("thGold"), "", "dyn-fee")}
      </div>
    </li>`;
  });
  html += `</ol><div class="dnotes"><div id="dGold"></div>`;
  if (c.batch && c.batch.amounts[0] < c.inAmt) {
    const b = c.batch.amounts;
    html += `<div>${t("batch", {
      a: `${amt(b[0])} ${esc(name(base))}`, b: `${amt(b[b.length - 1])} ${esc(name(target))}`,
      p: (c.batch.pct * 100 - 100).toFixed(2) })}</div>`;
  }
  html += `</div><div id="dWarn"></div>
    <div class="dsave"><button id="dSave" type="button">${t("dSave")}</button><div id="dSaveHint" class="muted"></div></div>
    <button id="dReset" type="button" class="ghost">${t("dReset")}</button>`;
  const body = $("#dBody");
  body.innerHTML = html;
  prepTips(body);
  body.querySelectorAll("[data-hide]").forEach(b => b.onclick = () => setExcluded("item", b.dataset.hide, true));
  body.querySelectorAll("input").forEach(inp => {
    inp.addEventListener("input", () => {
      const v = inp.value === "" ? null : +inp.value;
      const val = v > 0 ? v : null;
      if (inp.dataset.f === "start") o.start = val; else o[inp.dataset.f][+inp.dataset.k] = val;
      calcDrawer();
    });
    // Стрелки ↑/↓ — тот же шаг, что у кнопок (у step="any" браузер шагал бы на 1 и для курса).
    inp.addEventListener("keydown", e => {
      if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
      e.preventDefault();
      bump(inp, e.key === "ArrowUp" ? 1 : -1);
    });
  });
  body.querySelectorAll(".stepper button").forEach(btn =>
    holdRepeat(btn, () => bump(btn.parentElement.querySelector("input"), +btn.dataset.d)));
  $("#dReset").onclick = () => { overrides.delete(drawer.id); buildDrawer(); };
  $("#dSave").onclick = saveTrade;
  $("#dAlva").onclick = openAlva;
  if (focus) {
    const [f, k] = focus.split("|");
    body.querySelector(`input[data-f="${f}"]${k ? `[data-k="${k}"]` : ""}`)?.focus();
  }
  calcDrawer();
}

// Шаг курса — около 1% от величины (10.7 → 0.1, 1.29 → 0.01, 132 → 1); количества меняются по одной штуке.
// Пустое поле начинает от подсказки — рыночного курса или расчётного количества.
function bump(inp, dir) {
  const cur = inp.value !== "" ? +inp.value : +inp.placeholder;
  if (!(cur > 0)) return;
  let v;
  if (inp.dataset.f === "rate") {
    const step = 10 ** (Math.floor(Math.log10(cur)) - 2);
    v = (dir > 0 ? Math.floor(cur / step + 1e-9) + 1 : Math.ceil(cur / step - 1e-9) - 1) * step;
    v = +v.toPrecision(10);
  } else if (inp.dataset.f === "start" && $("#round").checked) {
    v = nextProfitStep(Math.floor(cur + 1e-9), dir);
  } else {
    v = dir > 0 ? Math.floor(cur + 1e-9) + 1 : Math.ceil(cur - 1e-9) - 1;
  }
  if (!(v > 0)) return;
  inp.value = v;
  inp.dispatchEvent(new Event("input"));
}

// В целых числах стартовую сумму листаем по уровням прибыли: «+» — наименьшая сумма больше текущей,
// где прибыль на 1 штуку конечной валюты больше; «−» — наименьшая сумма с прибылью на 1 меньше.
// Промежуточные суммы, которые ничего не добавляют из-за округлений, пропускаются.
function nextProfitStep(n0, dir) {
  const g0 = drawerRun(n0).gain;
  if (dir > 0) {
    for (let n = n0 + 1; n <= n0 + 1e5; n++) if (drawerRun(n).gain >= g0 + 1 - 1e-9) return n;
  } else {
    const goal = Math.max(1, g0 - 1);
    for (let n = 1; n < n0; n++) if (drawerRun(n).gain >= goal - 1e-9) return n;
  }
  // Прибыль от суммы не зависит (например, вписано фактически полученное) — обычный шаг.
  return n0 + dir;
}

// Прогон пути с правками из панели для заданной стартовой суммы.
// o — правки; без них (пустые) получается прогноз программы по рыночным курсам с запасом.
function drawerRun(start, o = ovFor(drawer.id)) {
  const c = drawer.c;
  const whole = $("#round").checked;
  const amounts = [start], calc = [];
  let a = start;
  c.edges.forEach((e, k) => {
    // Свой курс — это реальная цена в игре, запас на него не вычитаем.
    const r = o.rate[k];
    const rate = r > 0 ? (rateFwd(e) ? r : 1 / r) : e.rate * e.keep;
    let got = a * rate;
    if (whole) got = Math.floor(got + 1e-9);
    calc.push(got);
    if (o.got[k] > 0) got = o.got[k];
    amounts.push(got);
    a = got;
  });
  const direct = whole ? directWhole(start, c.bench) : start * c.bench;
  return { amounts, calc, out: a, direct, gain: a - direct };
}

function calcDrawer() {
  saveOverrides();
  const c = drawer.c, o = ovFor(drawer.id);
  const whole = $("#round").checked;
  const base = c.nodes[0], target = c.nodes[c.nodes.length - 1];
  const start = o.start > 0 ? o.start : c.inAmt;
  const { amounts, calc, out, direct, gain } = drawerRun(start);
  const pct = out / (start * c.bench) - 1;
  const gs = goldSteps(c.nodes, amounts), gold = goldSum(gs), eff = goldEff(gain * divValue(target), gold);
  const capDiv = start * divValue(base);
  const hours = c.edges.reduce((s, e) => s + stepHours(e, capDiv), 0);
  const sign = x => x > 0 ? "+" : "";

  $("#dGain").className = $("#dPct").className = gain > 0 ? "good" : "bad";
  $("#dGain").textContent = `${sign(gain)}${amt(gain)} ${name(target)}`;
  $("#dPct").textContent = `${sign(pct)}${(pct * 100).toFixed(2)}%`;
  const mi = (k, v) => `<div class="mi"><span class="mk">${k}</span><span class="mv">${v}</span></div>`;
  $("#dMeta").innerHTML = mi(t("dOutLbl"), `${amt(out)} ${esc(name(target))}`) +
    (c.streak != null ? mi(t("thStreak"), streakText(c)) : "") +
    (c.edges[0].hist ? mi(t("holdChance"), `<span title="${esc(t("holdChanceTip"))}">~${Math.round(holdChance(c.streak) * 100)}%</span>`) : "") +
    (c.seen ? mi(t("thSeen"), seenBadge(c.seen)) : "") +
    (base === target ? "" : mi(t("direct"), `${amt(direct)} ${esc(name(target))}`)) + mi(t("thTime"), dur(hours)) +
    (gold > 0 ? mi(t("thGold"), fmtGold(gold)) + mi(t("perGold"), isFinite(eff) ? fmt(eff) : "∞") : "");

  let thin = false, cur = -1;
  c.edges.forEach((e, k) => {
    const li = $(`#dBody .dstep[data-k="${k}"]`), got = amounts[k + 1];
    li.querySelector("[data-give]").textContent = amt(amounts[k]);
    li.querySelector("[data-got]").textContent = (Number.isInteger(got) ? "" : "≈") + amt(got);
    li.querySelector('input[data-f="rate"]').classList.toggle("ov", o.rate[k] > 0);
    const gotIn = li.querySelector('input[data-f="got"]');
    gotIn.classList.toggle("ov", o.got[k] > 0);
    gotIn.placeholder = whole ? calc[k] : +calc[k].toFixed(4);
    const done = o.got[k] > 0;
    li.classList.toggle("done", done);
    if (!done && cur < 0) cur = k;
    if (e.stock != null && got > e.stock) thin = true;
    li.querySelector(".dyn-time .mv").textContent = dur(stepHours(e, capDiv));
    li.querySelector(".dyn-fee").hidden = !(gs[k] == null || gs[k] > 0);
    li.querySelector(".dyn-fee .mv").innerHTML = gs[k] == null ? `<span title="${esc(t("feeUnknown"))}">?</span>`
      : `~${fmtGold(gs[k])}<small>${amt(market.items[e.to].gold)} × ${amt(Math.round(got))}</small>`;
  });
  $("#dBody").querySelectorAll(".dstep").forEach((li, k) => li.classList.toggle("now", k === cur));

  $("#dGold").innerHTML = gold > 0 ? t("goldTotal", {
    g: fmtGold(gold), unk: gs.includes(null) ? t("goldUnk") : "", eff: isFinite(eff) ? fmt(eff) : "∞", capped: "" }) : "";
  let warn = "";
  if (gain <= 0) warn += `<div class="dnote warn">${t("dLoss")}</div>`;
  if (c.minVol < 50) warn += `<div class="dnote warn">${t("warnLowVol")}</div>`;
  if (thin) warn += `<div class="dnote warn">${t("warnThin")}</div>`;
  if (hours > 6) warn += `<div class="dnote warn">${t("warnSlow")}</div>`;
  if (pct > 0.15) warn += `<div class="dnote warn">${t("warnHigh")}</div>`;
  $("#dWarn").innerHTML = warn;
  // Записать можно, когда во всех шагах вписано, сколько реально пришло.
  const complete = c.edges.every((e, k) => o.got[k] > 0);
  $("#dSave").disabled = !complete;
  // «Записано» держится несколько секунд, даже если панель за это время перерисовалась (пришли новые данные).
  const saved = drawer.savedId === drawer.id && Date.now() - drawer.savedAt < 4000;
  $("#dSaveHint").className = saved ? "good" : "muted";
  $("#dSaveHint").textContent = saved ? t("dSaved") : complete ? "" : t("dSaveNeed");
}

// Процент без «-0%»: сначала округляем, потом ставим знак.
function pctStr(x) {
  if (x === null || x === undefined || !isFinite(x)) return "—";
  const r = Math.round(x * 100);
  return (r > 0 ? "+" : "") + r + "%";
}

// График по часам: пропуски (часы без сделок) соединяются; zero — нарисовать линию нуля (для прибыли).
function trendSvg(vals, { w = 64, h = 18, cls = "", title = "", zero = false } = {}) {
  const pts = (vals || []).map((v, i) => [i, v]).filter(p => p[1] != null && isFinite(p[1]));
  if (pts.length < 2) return "";
  const P = 2, n = vals.length - 1;
  let lo = Math.min(...pts.map(p => p[1])), hi = Math.max(...pts.map(p => p[1]));
  if (zero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  const x = i => (P + i / n * (w - 2 * P)).toFixed(1);
  const y = v => (hi === lo ? h / 2 : P + (hi - v) / (hi - lo) * (h - 2 * P)).toFixed(1);
  const line = pts.map(([i, v]) => x(i) + "," + y(v)).join(" ");
  const [li, lv] = pts[pts.length - 1];
  const head = `<svg class="spark ${cls}" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${title ? `<title>${esc(title)}</title>` : ""}`;
  if (!zero) return head + `<polyline points="${line}"/><circle cx="${x(li)}" cy="${y(lv)}" r="1.8"/></svg>`;
  // Прибыль: одна и та же линия дважды, обрезанная по нулю — выше нуля зелёная, ниже красная.
  const id = "zc" + (++svgUid), yz = +y(0);
  const zl = lo < 0 && hi > 0 ? `<line class="z" x1="0" x2="${w}" y1="${yz}" y2="${yz}"/>` : "";
  return head + `<defs><clipPath id="${id}p"><rect x="0" y="-1" width="${w}" height="${yz + 1}"/></clipPath>` +
    `<clipPath id="${id}n"><rect x="0" y="${yz}" width="${w}" height="${h - yz + 1}"/></clipPath></defs>${zl}` +
    `<polyline class="pos" clip-path="url(#${id}p)" points="${line}"/><polyline class="neg" clip-path="url(#${id}n)" points="${line}"/>` +
    `<circle class="${lv >= 0 ? "pos" : "neg"}" cx="${x(li)}" cy="${y(lv)}" r="1.8"/></svg>`;
}
let svgUid = 0;
const firstLast = vals => { const v = (vals || []).filter(x => x != null && isFinite(x)); return v.length > 1 ? [v[0], v[v.length - 1]] : null; };
const pct1 = x => (x > 0 ? "+" : "") + (x * 100).toFixed(1) + "%";

// Мини-график курса за последние часы. Часы без сделок пропускаются; цвет — по итогу за период.
function sparkline(hist) {
  const fl = firstLast((hist || []).map(v => v > 0 ? v : null));
  if (!fl) return "";
  const vals = hist.filter(v => v > 0), d = fl[1] / fl[0] - 1;
  const cls = Math.abs(d) < 0.005 ? "flat" : d > 0 ? "up" : "down";
  const title = t("sparkTitle", { n: hist.length, a: fmt(fl[0]), b: fmt(fl[1]), p: pctStr(d), lo: fmt(Math.min(...vals)), hi: fmt(Math.max(...vals)) });
  return trendSvg(hist.map(v => v > 0 ? v : null), { cls, title });
}

// Тренд курса шага за последние часы — с точки зрения шага: сколько получаемой валюты дают за 1 отдаваемую.
// Вверх / плюс / зелёный — за ту же сумму получаешь больше; вниз / минус / красный — меньше.
// Точные числа «Курса в игре» (он может быть записан в обратную сторону) — в подсказке.
function stepTrend(e, fwd, pairText) {
  if (!e.hist) return "";
  const fav = firstLast(e.hist.map(v => v > 0 ? v : null));
  if (!fav) return "";
  const d = fav[1] / fav[0] - 1;                                   // для шага: + выгоднее
  const disp = fwd ? e.hist : e.hist.map(v => v > 0 ? 1 / v : null); // как в поле «Курс в игре»
  const [a, b] = firstLast(disp.map(v => v > 0 ? v : null));
  const cls = Math.abs(d) < 0.005 ? "flat" : d > 0 ? "up" : "down";
  const title = t("stepTrendTip", { pair: pairText.replace(/<[^>]+>/g, ""), n: e.hist.length, a: fmt(a), b: fmt(b), p: pct1(b / a - 1),
    verdict: t(cls === "flat" ? "trendFlat" : cls === "up" ? "trendBetter" : "trendWorse") });
  return `<div class="dtrend" title="${esc(title)}">${trendSvg(e.hist.map(v => v > 0 ? v : null), { w: 96, h: 26, cls })}` +
    `<span class="${cls}">${t("trendH", { n: e.hist.length })} ${pct1(d)}</span></div>`;
}

// ---------- фильтры: скрыть / открыть ----------
// На компьютере кнопка прячет левую панель, на телефоне открывает фильтры на весь экран.
const counts = { cycles: 0, flips: 0 };
const mobile = () => matchMedia("(max-width: 800px)").matches;
const activeTab = () => $(".tabs button.on")?.dataset.tab || "cycles";
function updateFilterUi() {
  if (!market) { $("#fsum").textContent = ""; }
  else {
    const base = $("#base").value, target = $("#target").value;
    $("#fsum").textContent = `${name(base)}${target && target !== base ? " → " + name(target) : ""} · ${$("#capital").value || 1}`;
  }
  const n = activeTab() === "flips" ? counts.flips : counts.cycles;
  $("#filtersDone").textContent = ["rates", "journal"].includes(activeTab()) ? t("done") : t("showResults", { n });
  $("#filtersBtn").setAttribute("aria-expanded", String(mobile() ? document.body.classList.contains("filters-open")
                                                                 : !document.documentElement.classList.contains("filters-hidden")));
}
function setFiltersOpen(open) {
  document.body.classList.toggle("filters-open", open);
  hideTip(); updateFilterUi();
}
$("#filtersBtn").onclick = () => {
  if (mobile()) return setFiltersOpen(true);
  ui.filtersHidden = !document.documentElement.classList.toggle("filters-hidden") ? undefined : true;
  saveUi(); updateFilterUi();
};
$("#filtersClose").onclick = $("#filtersDone").onclick = () => { setFiltersOpen(false); scrollTo(0, 0); };
matchMedia("(max-width: 800px)").addEventListener("change", () => { setFiltersOpen(false); });

// Выпадающий список сортировки — на телефоне вместо кликабельных заголовков.
function sortSelect(id, sorts, cur) {
  return `<div class="msort"><label>${t("sortBy")}<select id="${id}">${
    sorts.map(([k, lbl]) => `<option value="${k}"${k === cur ? " selected" : ""}>${t(lbl)}</option>`).join("")}</select></label></div>`;
}

// − / +: клик — один шаг, удержание — повтор.
function holdRepeat(btn, fn) {
  let timer = null;
  const stop = () => { clearTimeout(timer); timer = null; };
  btn.addEventListener("pointerdown", e => {
    e.preventDefault();
    fn();
    const again = delay => { timer = setTimeout(() => { fn(); again(70); }, delay); };
    again(400);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev => btn.addEventListener(ev, stop));
}

// ---------- стартовая и конечная валюта: кнопки ----------
// Торгуемых базовых валют всегда три (Chaos / Divine / Exalted), поэтому вместо списков — кнопки.
let lastTarget = "";  // конечная, выбранная до того, как включили «Конечная = стартовая»
function renderCurSeg() {
  if (!market) return;
  const base = $("#base").value, target = $("#target").value;
  if (target) lastTarget = target;
  const btn = (id, on, off) => {
    const it = market.items[id] || {};
    const img = it.image ? `<img src="${IMG}${it.image}" alt="">` : "";
    return `<button type="button" data-id="${esc(id)}" class="${on ? "on" : ""}" aria-pressed="${on}"${off ? " disabled" : ""} title="${esc(name(id))}">${img}<span>${
      esc(name(id).replace(/ Orb$/, ""))}</span></button>`;
  };
  $("#baseSeg").innerHTML = market.core.map(id => btn(id, id === base)).join("");
  // Конечная не может совпадать со стартовой — для этого есть галочка.
  $("#targetSeg").innerHTML = market.core.map(id => btn(id, id === target, id === base)).join("");
  $("#same").checked = !target;
  $("#targetBox").hidden = !target;
}
function setCur(sel, v) {
  $(sel).value = v;
  $(sel).dispatchEvent(new Event("input"));
  renderCurSeg();
}
$("#baseSeg").onclick = e => {
  const b = e.target.closest("button");
  if (!b) return;
  // Новая стартовая совпала с конечной — это уже цикл.
  if ($("#target").value === b.dataset.id) $("#target").value = "";
  setCur("#base", b.dataset.id);
};
$("#targetSeg").onclick = e => {
  const b = e.target.closest("button");
  if (b && !b.disabled) setCur("#target", b.dataset.id);
};
$("#same").onchange = () => {
  const base = $("#base").value;
  const other = lastTarget && lastTarget !== base ? lastTarget : market?.core.find(id => id !== base) || "";
  setCur("#target", $("#same").checked ? "" : other);
};

// ---------- кнопки вместо коротких списков ----------
// Значение живёт в скрытом <select> (его читают расчёты и сохранение настроек), кнопки только его меняют.
const segRenders = [];
function bindSeg(seg, sel, titleKeys) {
  const render = () => document.querySelectorAll(seg + " button").forEach((b, i) => {
    const on = b.dataset.v === $(sel).value;
    b.classList.toggle("on", on);

    $(sel).dispatchEvent(new Event("input"));

// ---------- капитал: − / + и предпросмотр ----------
// Шаг — 1 штука; меньше единицы (без «Целых чисел») — 0.1.
function capStep(cap, dir) {
  const whole = $("#round").checked;
  if (!whole && (cap < 1 || cap === 1 && dir < 0)) return Math.max(0.1, +(cap + dir * 0.1).toFixed(1));
  const v = dir > 0 ? Math.floor(cap + 1e-9) + 1 : Math.ceil(cap - 1e-9) - 1;
  return Math.max(whole ? 1 : 0.1, v);
}
function setCapital(v) {
  $("#capital").value = v;
  $("#capital").dispatchEvent(new Event("input"));
}
document.querySelectorAll("#capitalStep button").forEach(btn =>
  holdRepeat(btn, () => setCapital(capStep(+$("#capital").value || 1, +btn.dataset.d))));
$("#capital").addEventListener("keydown", e => {
  if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
  e.preventDefault();
  setCapital(capStep(+$("#capital").value || 1, e.key === "ArrowUp" ? 1 : -1));
});

// Макс. время цикла: шаг 0.5 ч; «−» от 0.5 очищает поле — без ограничения.
function hoursStep(dir) {
  const el = $("#maxHours"), cur = +el.value || 0;
  const v = dir > 0 ? Math.floor(cur * 2 + 1e-9) / 2 + 0.5 : Math.ceil(cur * 2 - 1e-9) / 2 - 0.5;
  el.value = v > 0 ? v : "";
  el.dispatchEvent(new Event("input"));
}
document.querySelectorAll("#maxHoursStep button").forEach(btn => holdRepeat(btn, () => hoursStep(+btn.dataset.d)));
$("#maxHours").addEventListener("keydown", e => {
  if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
  e.preventDefault();
  hoursStep(e.key === "ArrowUp" ? 1 : -1);
});

// «Держится от, ч»: шаг 1 ч; «−» от 1 очищает поле — фильтр выключен.
function streakStep(dir) {
  const el = $("#minStreak"), v = Math.round(+el.value || 0) + dir;
  el.value = v > 0 ? v : "";
  el.dispatchEvent(new Event("input"));
}
document.querySelectorAll("#minStreakStep button").forEach(btn => holdRepeat(btn, () => streakStep(+btn.dataset.d)));
$("#minStreak").addEventListener("keydown", e => {
  if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
  e.preventDefault();
  streakStep(e.key === "ArrowUp" ? 1 : -1);
});

// Сколько результатов будет при капитале на шаг меньше и больше. Считается в фоне после отрисовки:
// в «Целых числах» у каждого пути своя целая сумма ≤ капитала, поэтому выдача меняется скачками.
let capPrevTimer = null;
function scheduleCapPreview() {
  clearTimeout(capPrevTimer);
  capScanToken++;
  $("#capBest").innerHTML = "";
  capPrevTimer = setTimeout(capPreview, 120);
}
function capPreview() {
  const box = $("#capPrev"), tab = activeTab();
  const token = ++capScanToken;
  $("#capBest").innerHTML = "";
  if (!market || tab === "rates" || tab === "journal") { box.innerHTML = ""; return; }
  const cap = +$("#capital").value || 1;
  const countAt = tab === "flips" ? c => flipCandidates(c).length : (() => {
    const paths = findPaths();
    return c => evalCycles(paths, c).length;
  })();
  const now = countAt(cap);
  const cell = dir => {
    const c = capStep(cap, dir);
    if (c === cap) return "<span></span>";
    const n = countAt(c), d = n - now;
    const cls = d > 0 ? "up" : d < 0 ? "down" : "";
    return `<button type="button" data-cap="${c}" title="${esc(t("capPrevTitle", { c: amt(c) }))}">${dir < 0 ? "← " : ""}${amt(c)}: ${n}${
      d ? ` <span class="${cls}">(${d > 0 ? "+" : ""}${d})</span>` : ""}${dir > 0 ? " →" : ""}</button>`;
  };
  box.innerHTML = cell(-1) + cell(1);
  box.querySelectorAll("button").forEach(b => b.onclick = () => setCapital(+b.dataset.cap));
  scanBestCaps(cap, now, countAt, token);
}

// Ближайшие значения капитала, где результатов больше, чем сейчас: перебираем окрестность ±20%
// (не меньше ±10 штук) порциями в фоне, чтобы не тормозить ввод. Новый ввод отменяет старый перебор.
let capScanToken = 0;
function scanBestCaps(cap, now, countAt, token) {
  const whole = $("#round").checked;
  const unit = !whole && cap < 2 ? 0.1 : 1;
  const r = Math.max(10 * unit, Math.ceil(cap * 0.2 / unit) * unit);
  const step = Math.max(unit, Math.ceil(2 * r / 40 / unit) * unit);  // не больше ~40 прогонов
  const cands = [];
  for (let c = Math.max(unit, cap - r); c <= cap + r + 1e-9; c += step) {
    const v = +c.toFixed(1);
    if (Math.abs(v - cap) > 1e-9) cands.push(v);
  }
  const res = [];
  const chunk = () => {
    if (token !== capScanToken) return;
    for (let i = 0; i < 4 && cands.length; i++) { const c = cands.shift(); res.push({ c, n: countAt(c) }); }
    if (cands.length) return setTimeout(chunk, 0);
    // Подряд идущие суммы с одинаковой выдачей — одно «плато»: оставляем самую дешёвую из них.
    res.sort((a, b) => a.c - b.c);
    const plateaus = res.filter((x, i) => !(i && res[i - 1].n === x.n && x.c - res[i - 1].c <= step + 1e-9));
    // Лучшие по количеству; при равенстве — ближе к текущему капиталу. Показываем по возрастанию суммы.
    const best = plateaus.filter(x => x.n > now)
      .sort((a, b) => b.n - a.n || Math.abs(a.c - cap) - Math.abs(b.c - cap)).slice(0, 4)
      .sort((a, b) => a.c - b.c);
    $("#capBest").innerHTML = best.length ? `<span class="muted">${t("capBest")}</span>` + best.map(x =>
      `<button type="button" data-cap="${x.c}" title="${esc(t("capPrevTitle", { c: amt(x.c) }))}">${amt(x.c)} · ${x.n} <b>+${x.n - now}</b></button>`).join("") : "";
    $("#capBest").querySelectorAll("button").forEach(b => b.onclick = () => setCapital(+b.dataset.cap));
  };
  setTimeout(chunk, 0);
}

// ---------- когда путь впервые появился в выдаче ----------
// Хранится в браузере по лиге и источнику. Пока путь хотя бы иногда попадает в выдачу, время не сбрасывается
// (например, при смене фильтров туда-обратно); не появлялся больше суток — считается найденным заново.
const SEEN_KEY = "poe2flip_seen", SEEN_TTL = 86400;
let seenDb = (() => { try { return JSON.parse(localStorage.getItem(SEEN_KEY)) || {}; } catch (e) { return {}; } })();
function markSeen(list) {
  const now = Math.floor(Date.now() / 1000), pre = market.league + "|" + market.source + "|";
  for (const c of list) {
    const k = pre + c.nodes.join(">");
    const r = seenDb[k] && now - seenDb[k][1] <= SEEN_TTL ? seenDb[k] : [now, now];
    r[1] = now;
    seenDb[k] = r;
    c.seen = r[0];
  }
  for (const k in seenDb) if (now - seenDb[k][1] > SEEN_TTL) delete seenDb[k];
  try { localStorage.setItem(SEEN_KEY, JSON.stringify(seenDb)); } catch (e) {}
}
// «Найден» — обычный серый текст; «N мин назад» обновляется сам, без перерисовки таблицы.

// Хранятся в настройках браузера; стартовая/конечная и базовые валюты (Chaos/Divine/Exalted) не исключаются.
const CATS = {
  Currency: ["Валюта", "Currency", "通货"], Fragments: ["Фрагменты", "Fragments", "碎片"], Runes: ["Руны", "Runes", "符文"],
  Essences: ["Эссенции", "Essences", "精华"], Ritual: ["Ритуал (знамения)", "Ritual (omens)", "仪式（预兆）"],
  Expedition: ["Экспедиция", "Expedition", "探险"], Delirium: ["Делириум", "Delirium", "谵妄"], Breach: ["Разлом", "Breach", "裂隙"],
  Abyss: ["Бездна", "Abyss", "深渊"], SoulCores: ["Ядра душ", "Soul Cores", "灵魂核心"], UncutGems: ["Неогранённые камни", "Uncut Gems", "未切割宝石"],
  LineageSupportGems: ["Камни поддержки рода", "Lineage Supports", "传承辅助宝石"], Idols: ["Идолы", "Idols", "神像"], Verisium: ["Верисиум", "Verisium", "Verisium"],
};
const catName = id => (CATS[id] || [])[["ru", "en", "zh"].indexOf(lang)] || String(id).replace(/([a-z])([A-Z])/g, "$1 $2");
const exItems = () => new Set(ui.exItems || []);
const exCats = () => new Set(ui.exCats || []);
// Проверка «исключён ли»; списки собираются один раз — граф строится часто (подсказки капитала и т.п.).
function excluder() {
  const items = exItems(), cats = exCats();
  if (!market || (!items.size && !cats.size)) return () => false;
  const keep = new Set([...market.core, $("#base").value, $("#target").value]);
  return id => !keep.has(id) && (items.has(id) || cats.has(market.items[id]?.category));
}
function setExcluded(kind, id, on) {
  setTimeout(scheduleTgSync);
  const set = kind === "cat" ? exCats() : exItems();
  if (on) set.add(id); else set.delete(id);
  ui[kind === "cat" ? "exCats" : "exItems"] = [...set];
  saveUi();
  renderExclude();
  renderCycles(); renderFlips(); scheduleNotifyBaseline();
}
function renderExclude() {
  if (!market) return;
  const used = new Set();
  for (const p of market.pairs) for (const id of [p.from, p.to]) if (!market.core.includes(id)) used.add(market.items[id]?.category);
  used.delete(undefined);
  const cats = [...used].sort((a, b) => catName(a).localeCompare(catName(b)));
  const xc = exCats();
  $("#exCats").innerHTML = cats.map(c => `<button type="button" class="xchip${xc.has(c) ? " off" : ""}" data-cat="${esc(c)}"
      title="${esc(t(xc.has(c) ? "exCatOn" : "exCatOff"))}">${esc(catName(c))}</button>`).join("");
  const xi = [...exItems()];
  $("#exItems").innerHTML = xi.length
    ? `<span class="muted xlbl">${t("exHidden")}</span>` + xi.map(id => `<span class="xitem">${market.items[id] ? chip(id) : `<span class="cur">${esc(id)}</span>`}
        <button type="button" data-item="${esc(id)}" title="${esc(t("exShow"))}">×</button></span>`).join("")
    : `<span class="muted xlbl">${t("exNone")}</span>`;
  $("#exCats").querySelectorAll("button").forEach(b => b.onclick = () => setExcluded("cat", b.dataset.cat, !b.classList.contains("off")));
  $("#exItems").querySelectorAll("button").forEach(b => b.onclick = () => setExcluded("item", b.dataset.item, false));
}

// ---------- уведомления о новых путях ----------
// Проверяются только после загрузки свежих данных. Первая проверка (после открытия страницы, включения или
// смены лиги/источника/окна/валют) лишь запоминает текущие пути. Смена фильтров тоже запоминает выдачу молча,
// чтобы не сыпать уведомлениями. Путь, пропавший больше чем на 2 ч, при возвращении считается новым.
const notifyKnown = new Map();  // id пути -> когда последний раз проходил условия
let notifyKey = null, notifyTimer = null, unseen = 0, audioCtx = null;
const notifyApi = () => "Notification" in window && window.isSecureContext;

function notifyMatches() {
  const minPct = (+$("#notifyPct").value || 0) / 100, minStreak = +$("#notifyStreak").value || 0;
  return evalCycles(findPaths(), +$("#capital").value || 1)
    .filter(c => c.pct >= minPct && (!minStreak || c.streak >= minStreak));
}
function checkNotify(silent = false) {
  if (!market || !$("#notifyOn").checked) return;
  const key = [market.league, market.source, $("#window").value, $("#base").value, $("#target").value].join("|");
  if (key !== notifyKey) { notifyKey = key; notifyKnown.clear(); silent = true; }
  const now = Date.now() / 1000, fresh = [];
  for (const c of notifyMatches()) {
    const id = c.nodes.join(">"), last = notifyKnown.get(id);
    if (!silent && (last == null || now - last > 7200)) fresh.push(c);
    notifyKnown.set(id, now);
  }
  if (fresh.length) announce(fresh.sort((a, b) => b.pct - a.pct));
}
function scheduleNotifyBaseline() {
  clearTimeout(notifyTimer);
  notifyTimer = setTimeout(() => checkNotify(true), 600);
}

function notifyEnable() {
  if ($("#notifyOn").checked) {
    // Разрешение и звук можно запросить только из действия пользователя — то есть сейчас, по клику.
    if (notifyApi() && Notification.permission === "default") Notification.requestPermission().then(notifyUi);
    try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    notifyKey = null;
    checkNotify(true);
  }
  notifyUi();
}
// ---------- Telegram ----------
// Сервер сам раз в 5 минут обновляет данные и ищет пути по фильтрам этой страницы — уведомления приходят,
// даже когда вкладка закрыта. Фильтры отправляются серверу автоматически при каждом изменении.
let tg = null, tgSyncTimer = null, tgBusy = false, tgMsg = null, tgPollTimer = null;
async function loadTg() {
  try {
    const r = await fetch("/api/notify");
    tg = r.ok ? await r.json() : null;
  } catch (e) { tg = null; }
  renderTg();
}
async function tgOp(body) {
  tgBusy = true; tgMsg = null; renderTg();
  try {
    const r = await fetch("/api/notify", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || (r.status === 404 || r.status === 501 ? t("tgOldServer") : "HTTP " + r.status));
    tg = d;
    return true;
  } catch (e) {
    tgMsg = { bad: true, text: e.message };
    return false;
  } finally { tgBusy = false; renderTg(); }
}
// Настройки, по которым ищет сервер, — те же, что на странице (без «Целых чисел» и фильтров по золоту).

  const v = id => $("#" + id).value;

    notifyPct: v("notifyPct"), notifyStreak: v("notifyStreak"), lang };

const tgWanted = () => !!$("#tgOn")?.checked;
// Общий бот автора программы: большинству не нужно заводить своего — достаточно написать ему /start.
const PUBLIC_BOT = "PoeFlipperBot";
let tgOwnOpen = false;
function scheduleTgSync() {
  if (!tg?.linked) return;
  clearTimeout(tgSyncTimer);
  tgSyncTimer = setTimeout(() => tgOp({ op: "settings", settings: notifySnapshot(), enabled: tgWanted() }), 1500);

  if (!tg?.configured) {

    const url = "https://t.me/" + PUBLIC_BOT;

      <div class="muted small">${t("tgPubNote")}</div>
      <button type="button" id="tgOwnToggle" class="linkbtn">${tgOwnOpen ? t("tgOwnHide") : t("tgOwnLink")}</button>`;
    if (tgOwnOpen) html += tg === null ? `<div class="muted">${t("tgOldServer")}</div>`
      : `<div class="muted">${t("tgStep1")}</div>
      <div class="tgrow"><input id="tgToken" type="password" autocomplete="off" placeholder="123456:ABC-DEF…"><button type="button" id="tgSave">${t("tgConnect")}</button></div>`;
  }
  else if (!tg.linked) html += `<div class="muted">${t("tgStep2", { bot: esc(tg.bot || "") })}</div>

function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.18].forEach((d, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t0 = audioCtx.currentTime + d;
      o.frequency.value = i ? 1175 : 880;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.15, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.15);
      o.connect(g).connect(audioCtx.destination);
      o.start(t0); o.stop(t0 + 0.16);
    });
  } catch (e) {}
}
function toast(c, more) {
  const el = document.createElement("div");

    <button type="button" class="topen">${t("toastOpen")}</button>`;
  const close = () => { el.classList.add("out"); setTimeout(() => el.remove(), 250); };
  el.querySelector(".tx").onclick = close;
  el.querySelector(".topen").onclick = () => { openFromToast(c); close(); };
  $("#toasts").prepend(el);
  while ($("#toasts").children.length > 4) $("#toasts").lastElementChild.remove();
  setTimeout(close, 30000);
}

// Хранится на сервере (cache/journal.json): общий для компьютера и телефона. null — сервер старый, без журнала.
let journal = [];
async function loadJournal() {
  try {
    const r = await fetch("/api/journal");
    journal = r.ok ? await r.json() : null;
  } catch (e) { journal = null; }
  renderJournal();
}
async function journalOp(body) {
  const r = await fetch("/api/journal", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(r.status === 404 || r.status === 501 ? t("jNoServer") : "HTTP " + r.status);
